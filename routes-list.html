<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tuyến đường - Hệ thống quản lý vận chuyển">
    <title>Tuyến đường</title>
    <link rel="stylesheet" href="routes-list.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Header with Navigation -->
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <button class="nav-btn">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </button>
                <div class="nav-tabs">
                    <a href="#" class="nav-tab">Công Ty</a>
                    <a href="#" class="nav-tab">Công Ty</a>
                    <a href="#" class="nav-tab">Dự án</a>
                    <a href="#" class="nav-tab active">Tuyến đường</a>
                    <a href="#" class="nav-tab">Tuyến phụ trách</a>
                </div>
            </div>
            <div class="header-right">
                <div class="notification-badge">
                    <svg class="notification-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="badge">87</span>
                </div>
                <div class="user-info">
                    <div class="user-avatar">D</div>
                    <span class="user-email">danghaile2003@gmail.com</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Sub Navigation / Toolbar -->
    <div class="toolbar">
        <div class="toolbar-left">
            <h1 class="page-title">Tuyến đường</h1>
        </div>
        <div class="toolbar-right">
            <div class="search-box">
                <input type="text" class="search-input" placeholder="Tìm kiếm...">
                <button class="search-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="M21 21l-4.35-4.35"></path>
                    </svg>
                </button>
            </div>
            <button class="filter-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                </svg>
            </button>
            <div class="pagination-info">
                <span>1-50 / 616</span>
                <button class="pagination-btn prev" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <button class="pagination-btn next">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
            <button class="btn-import">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                IMPORT
            </button>
            <button class="btn-add" id="btnAddRoute">
                THÊM TUYẾN ĐƯỜNG
            </button>
        </div>
    </div>

    <!-- Main Content - Data Table -->
    <main class="main-content">
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="col-name">Tên tuyến</th>
                        <th class="col-code">Mã tuyến</th>
                        <th class="col-project-name">Tên dự án</th>
                        <th class="col-project-code">Mã dự án</th>
                        <th class="col-company-name">Tên công ty</th>
                        <th class="col-company-code">Mã công ty</th>
                        <th class="col-status">Chính thức</th>
                        <th class="col-actions"></th>
                    </tr>
                </thead>
                <tbody id="routesTableBody">
                    <!-- Data will be rendered by JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal for Route Detail Preview -->
    <div class="modal-overlay" id="routeDetailModal">
        <div class="modal-container">
            <div class="modal-header">
                <h2 class="modal-title" id="modalRouteTitle">Chi tiết tuyến đường</h2>
                <button class="modal-close-btn" id="modalCloseBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <!-- Stops Section - Same as detail page -->
                <div class="stops-section-modal">
                    <div class="stops-header">
                        <h3 class="section-title">Điểm và tuyến con</h3>
                        <div class="stops-summary" id="modalStopsSummary">
                            <span class="summary-item">
                                <svg class="summary-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                    <circle cx="12" cy="10" r="3"></circle>
                                </svg>
                                <span id="modalStopsCount">0 điểm</span>
                            </span>
                            <span class="summary-divider">|</span>
                            <span class="summary-item">
                                <svg class="summary-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                                </svg>
                                <span id="modalSubRoutesCount">0 tuyến con</span>
                            </span>
                        </div>
                    </div>

                    <!-- Timeline Container - Same as detail page -->
                    <div class="route-timeline-container">
                        <div class="route-timeline" id="modalTimeline">
                            <!-- Rendered by JS -->
                        </div>
                    </div>

                    <!-- Route Stats - Same as detail page -->
                    <div class="route-stats" id="modalRouteStats">
                        <!-- Rendered by JS -->
                    </div>
                </div>

                <!-- Map Section -->
                <div class="modal-section">
                    <div class="modal-section-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                            <line x1="8" y1="2" x2="8" y2="18"></line>
                            <line x1="16" y1="6" x2="16" y2="22"></line>
                        </svg>
                        Bản đồ tuyến đường
                    </div>
                    <div class="modal-map-container" id="modalMapContainer">
                        <img src="img/map-sample.png" alt="Bản đồ tuyến đường" class="modal-map-image">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-secondary" id="modalCancelBtn">Đóng</button>
                <button class="modal-btn modal-btn-primary" id="modalEditBtn">Chỉnh sửa</button>
            </div>
        </div>
    </div>

    <script src="routes-list.js"></script>
</body>

</html>
